<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASSIST: Connected Hearts</title>
<meta name="description" content="Conecta con alguien que te entienda.">
<meta name="theme-color" content="#120a22">
<link rel="stylesheet" href="styles/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23120a22'/><path d='M4 5h2v1h1v1h2V6h1V5h2v1h1v3h-1v1h-1v1h-1v1H8v1H7v-1H6v-1H5v-1H4V9H3V6h1z' fill='%23ff4d94'/></svg>">
</head>
<body data-phase="1">

<div id="device" class="device">

  <!-- Cabecera de la app -->
  <header id="appbar" class="appbar" hidden>
    <button class="ab-back" id="btn-back" aria-label="Volver">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="ab-title">
      <span class="ab-name" id="ab-name">ASSIST</span>
      <span class="ab-sub" id="ab-sub"></span>
    </div>
    <div class="ab-right" id="ab-right"></div>
  </header>

  <!-- Pantalla activa -->
  <main id="screen" class="screen" aria-live="polite"></main>

  <!-- Barra de navegación -->
  <nav id="tabbar" class="tabbar" hidden aria-label="Navegación principal"></nav>

  <!-- Avisos emergentes -->
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <!-- Capa de decadencia -->
  <div id="fx" class="fx" aria-hidden="true">
    <div class="fx-scan"></div>
    <div class="fx-grain"></div>
    <div class="fx-flash"></div>
  </div>

  <!-- Ventana modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-close aria-label="Cerrar">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<noscript>
  <div style="padding:2rem;font-family:sans-serif;color:#eee;background:#120a22">
    ASSIST: Connected Hearts necesita JavaScript para funcionar.
  </div>
</noscript>

<script type="module" src="src/main.js"></script>
</body>
</html>
